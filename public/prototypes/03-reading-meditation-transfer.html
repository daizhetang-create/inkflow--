<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨流原型 03｜阅读/冥想迁移</title>
<style>
:root{--bg:#15191d;--text:#f1efe9;--muted:#90979d;--cyan:#79e5d7;--line:#343b40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:190px 1fr}.side{border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;justify-content:space-between}.logo{font-weight:800}.mode{display:grid;gap:9px}.mode button{background:transparent;color:var(--muted);border:0;text-align:left;padding:12px;border-left:2px solid transparent}.mode button.on{color:var(--text);border-color:var(--cyan)}.main{padding:clamp(24px,7vw,90px);display:grid;align-content:center}.view{display:none;max-width:950px}.view.on{display:block;animation:show .4s ease}.tag{font:700 11px ui-monospace,monospace;color:var(--cyan);letter-spacing:.15em}h1{font-size:clamp(42px,7vw,88px);line-height:.98;letter-spacing:-.055em;margin:20px 0 24px}p{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:end;margin-top:38px}.field{display:grid;gap:9px}.field label{font-size:12px;color:var(--muted)}input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:12px 0;outline:none}input:focus{border-color:var(--cyan)}.primary,.quiet{min-height:48px;padding:0 20px;border:1px solid var(--cyan);background:var(--cyan);color:#10211f;font-weight:800}.quiet{background:transparent;color:var(--text);border-color:var(--line)}.thread{margin:44px 0;height:90px;display:flex;align-items:center}.thread:before,.thread:after{content:"";height:3px;background:var(--cyan);flex:1}.thread:after{background:repeating-linear-gradient(90deg,var(--line),var(--line) 8px,transparent 8px,transparent 15px)}.thread.returned:after{background:var(--cyan)}.thread span{border:1px solid var(--cyan);padding:12px 16px;color:var(--cyan);font:12px ui-monospace,monospace}.actions{display:flex;gap:10px;flex-wrap:wrap}.quote{font-size:clamp(28px,4vw,52px);max-width:820px}.proof{margin-top:30px;color:var(--cyan);font:700 18px ui-monospace,monospace}@keyframes show{from{opacity:0;transform:translateY(12px)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:18px;flex-direction:row}.mode{display:flex}.fields{grid-template-columns:1fr}.side small{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="app"><aside class="side"><div class="logo">墨流 / 03</div><div class="mode"><button data-mode="read" class="on">阅读</button><button data-mode="meditate">冥想</button></div><small>同一个内核<br>两种场景</small></aside><main class="main">
<section class="view on" data-view="start"><div class="tag">TRANSFER TEST · <span id="mode-tag">READING</span></div><h1 id="headline">电话来了。<br>别让刚才的问题消失。</h1><p id="description">墨流不记录页数。它只保存你回到这段文字时真正需要的那一步。</p><form class="fields" id="form"><div class="field"><label id="intent-label">正在读什么</label><input id="intent" value="任务中断与恢复研究"></div><div class="field"><label>回来第一步</label><input id="next" value="继续找 resumption lag 的定义" required></div><button class="primary">封存 →</button></form></section>
<section class="view" data-view="gap"><div class="tag">CHECKPOINT SAVED</div><h1 id="gap-title">这一小段间隙，<br>不需要塞进新内容。</h1><div class="thread"><span id="packet"></span></div><div class="actions"><button class="quiet" id="blank">只留白</button><button class="quiet" id="back">我回来了</button></div></section>
<section class="view" data-view="return"><div class="tag">RETURN · 用户主动回来</div><h1 class="quote" id="return-copy"></h1><div class="thread returned"><span>CONTEXT RESTORED</span></div><div class="actions"><button class="primary" id="take">接回这一步 →</button><button class="quiet" id="lost">给我更小一步</button></div></section>
<section class="view" data-view="done"><div class="tag">SAME KERNEL · DIFFERENT CONTEXT</div><h1 id="done-title">回到文字，<br>不是回到墨流。</h1><p id="done-copy"></p><div class="proof">checkpoint → gap → return</div><button class="quiet" id="reset" style="margin-top:32px">换一个场景</button></section>
</main></div><script>
const copy={read:{tag:'READING',headline:'电话来了。<br>别让刚才的问题消失。',description:'墨流不记录页数。它只保存你回到这段文字时真正需要的那一步。',label:'正在读什么',intent:'任务中断与恢复研究',next:'继续找 resumption lag 的定义',gap:'这一小段间隙，<br>不需要塞进新内容。',done:'回到文字，<br>不是回到墨流。'},meditate:{tag:'MEDITATION',headline:'门铃响了。<br>别把练习判成失败。',description:'冥想被打断不是失败。留下回来后的一个呼吸，就能从现实位置继续。',label:'今天的练习',intent:'十分钟身体扫描',next:'坐回去，先完整呼出一口气',gap:'处理中断，<br>不要求自己保持平静。',done:'回到呼吸，<br>不是回到墨流。'}};let mode='read';const views=[...document.querySelectorAll('.view')];function show(n){views.forEach(v=>v.classList.toggle('on',v.dataset.view===n))}function render(){const c=copy[mode];document.querySelector('#mode-tag').textContent=c.tag;document.querySelector('#headline').innerHTML=c.headline;document.querySelector('#description').textContent=c.description;document.querySelector('#intent-label').textContent=c.label;document.querySelector('#intent').value=c.intent;document.querySelector('#next').value=c.next;document.querySelector('#gap-title').innerHTML=c.gap;document.querySelector('#done-title').innerHTML=c.done}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));render();show('start')});document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#packet').textContent=document.querySelector('#next').value;show('gap')};document.querySelector('#blank').onclick=()=>document.querySelector('#blank').textContent='留白中 · 随时回来';document.querySelector('#back').onclick=()=>{document.querySelector('#return-copy').textContent=document.querySelector('#next').value;show('return')};document.querySelector('#lost').onclick=()=>{document.querySelector('#return-copy').textContent=mode==='read'?'只打开原文，看最后一段的第一句。':'只坐回原位，不要求立刻闭眼。'};document.querySelector('#take').onclick=()=>{document.querySelector('#done-copy').textContent='这次迁移没有计时、页数或连续签到；核心动作没有改变。';show('done')};document.querySelector('#reset').onclick=()=>show('start');render();
</script></body></html>
