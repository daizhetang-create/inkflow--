<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨流原型 02｜主动偏航救援</title>
<style>
:root{--bg:#f0f1ed;--ink:#191b1a;--muted:#686d69;--amber:#e8572a;--rule:#b8bcb7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Narrow","PingFang SC",sans-serif}button,input{font:inherit}.wrap{min-height:100vh;padding:24px clamp(20px,6vw,90px);display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{display:flex;justify-content:space-between;font:700 11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}.stage{align-self:center;max-width:1100px;width:100%;margin:auto}.screen{display:none}.screen.active{display:block;animation:in .35s ease-out}.kicker{color:var(--amber);font:700 12px ui-monospace,monospace}h1{font-size:clamp(54px,10vw,132px);line-height:.86;letter-spacing:-.07em;margin:24px 0 34px;max-width:950px}p{font-size:18px;line-height:1.6;color:var(--muted);max-width:620px}.panic{margin-top:35px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:18px 24px;font-weight:800}.choice{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}.choice button,.primary{border:1px solid var(--ink);background:transparent;padding:15px 21px;font-weight:750}.choice button:first-child,.primary{background:var(--amber);border-color:var(--amber);color:#fff}.route{height:120px;position:relative;margin:40px 0}.route:before{content:"";position:absolute;left:0;right:0;top:58px;height:1px;background:var(--rule)}.route i{position:absolute;left:24%;top:50px;width:18px;height:18px;border-radius:50%;background:var(--amber)}.route b{position:absolute;right:12%;top:48px;width:22px;height:22px;border:3px solid var(--ink);transform:rotate(45deg)}.route span{position:absolute;left:calc(24% + 16px);right:calc(12% + 18px);top:58px;border-top:3px dashed var(--amber);transform-origin:left;animation:draw .8s ease-out}.field{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:16px;align-items:end;margin-top:30px}.field label{font:700 12px ui-monospace,monospace;color:var(--muted)}input{border:0;border-bottom:2px solid var(--ink);background:transparent;padding:12px 0;outline:none;font-size:20px}.done{font:700 clamp(28px,5vw,60px) ui-monospace,monospace;color:var(--amber);margin-top:34px}@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes draw{from{transform:scaleX(0)}}@media(max-width:700px){.field{grid-template-columns:1fr}.top span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="wrap"><div class="top"><span>墨流 / PROTOTYPE 02</span><span>Drift Rescue · 用户主动触发</span></div><main class="stage">
<section class="screen active" data-screen="idle"><div class="kicker">ACTIVE · 原任务仍在</div><h1>不是每次离开，<br>都要从头开始。</h1><p>假设你刚刚发现自己已经刷了两分钟网页。墨流不知道你去了哪里，只有你可以诚实地按下这个按钮。</p><button class="panic" id="drift">我飘走了，帮我回来 →</button></section>
<section class="screen" data-screen="intent"><div class="kicker">DRIFT · 不记录失败</div><h1>目的还一样吗？</h1><p>原目的：完成 vNext 状态机。偏航不改变目的，除非你决定改变。</p><div class="choice"><button id="same">一样，帮我重算</button><button id="changed">变了，放下这一条</button></div></section>
<section class="screen" data-screen="route"><div class="kicker">REROUTE · 从当前位置出发</div><h1>不用回到原路。<br>只迈回去一步。</h1><div class="route"><i></i><span></span><b></b></div><form class="field" id="route-form"><label for="tiny">现在最小的一步</label><input id="tiny" value="打开 reducer.ts，只看非法转换" required maxlength="100"><button class="primary">接回 →</button></form></section>
<section class="screen" data-screen="done"><div class="kicker">RETURN CONFIRMED</div><h1>你回来了。<br>现在离开墨流。</h1><p id="chosen"></p><div class="done" id="latency"></div><button class="primary" id="again">重新演示</button></section>
</main><div class="bottom"><span>没有羞耻 · 没有 streak</span><span id="state">Active</span></div></div><script>
const screens=[...document.querySelectorAll('.screen')],state=document.querySelector('#state');let start=0;function show(n,s){screens.forEach(x=>x.classList.toggle('active',x.dataset.screen===n));state.textContent=s}document.querySelector('#drift').onclick=()=>{start=Date.now();show('intent','Drift')};document.querySelector('#same').onclick=()=>show('route','Return · rerouted');document.querySelector('#changed').onclick=()=>{document.querySelector('#chosen').textContent='这条目的已由你主动放下。';document.querySelector('#latency').textContent='0 惩罚';show('done','Idle · session_closed')};document.querySelector('#route-form').onsubmit=e=>{e.preventDefault();document.querySelector('#chosen').textContent='第一步：'+document.querySelector('#tiny').value;document.querySelector('#latency').textContent=Math.max(1,Math.round((Date.now()-start)/1000))+' 秒从察觉到接回';show('done','Active · return_confirmed')};document.querySelector('#again').onclick=()=>show('idle','Active');
</script></body></html>
